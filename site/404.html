<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>404 — Liidia</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/liidia-logo10-green.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#284B3C">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F3EC;color:#222B25;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a,button,[role="button"],summary{-webkit-touch-callout:none;touch-action:manipulation}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
a{color:#284B3C}
a:hover{color:#1B3529}
:focus-visible{outline:2px solid #284B3C;outline-offset:3px}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#F6F3EC">
  <header style="padding:24px clamp(20px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px">
    <a href="./" aria-label="Liidia"><img src="assets/liidia-logo11-green.svg" alt="Liidia — resting place" style="display:block;height:48px;width:auto"></a>
    <div style="position:relative">
      <button type="button" onClick="{{ toggleLang }}" aria-haspopup="true" aria-expanded="{{ langExpanded }}" aria-label="{{ langBtnLabel }}" style="display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border:1px solid #D4D8CE;border-radius:8px;background:#fff;color:#222B25;cursor:pointer;font:600 14px/1 Manrope,system-ui,sans-serif;letter-spacing:.04em;transition:border-color .18s" style-hover="border-color:#284B3C">
        <span aria-hidden="true" style="display:block;flex:none;width:22px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(34,43,37,.12);background:#E6EBE2 url({{ langFlag }}) center/cover no-repeat"></span>
        <span>{{ langCode }}</span>
        <span aria-hidden="true" style="width:14px;height:14px;background:currentColor;transform:{{ langChevron }};transition:transform .25s cubic-bezier(.2,.7,.2,1);-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-down.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/chevron-down.svg) center/contain no-repeat"></span>
      </button>
      <div role="menu" aria-label="Language" aria-hidden="{{ langHidden }}" style="position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:180px;padding:6px;background:#fff;border:1px solid #D4D8CE;border-radius:10px;box-shadow:0 12px 32px rgba(34,43,37,.14);display:flex;flex-direction:column;gap:2px;opacity:{{ langOpacity }};transform:{{ langShift }};visibility:{{ langVis }};transition:opacity .2s ease,transform .25s cubic-bezier(.2,.7,.2,1),visibility .25s">
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
          <button type="button" role="menuitemradio" aria-checked="{{ l.pressed }}" onClick="{{ l.pick }}" lang="{{ l.code }}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;padding:0 12px;border:0;border-radius:6px;cursor:pointer;text-align:left;font:500 15px/1 Manrope,system-ui,sans-serif;background:{{ l.bg }};color:#222B25" style-hover="background:#E6EBE2">
            <span style="display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="display:block;flex:none;width:22px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(34,43,37,.12);background:#E6EBE2 url({{ l.flag }}) center/cover no-repeat"></span><span>{{ l.name }}</span></span>
            <span style="font-size:12px;font-weight:700;letter-spacing:.08em;color:{{ l.fg }}">{{ l.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(32px,6vw,80px) clamp(20px,4vw,48px)">
    <p style="margin:0;font-family:Lora,Georgia,serif;font-weight:500;font-size:clamp(120px,22vw,280px);line-height:.85;letter-spacing:-.05em;color:#284B3C">404</p>
    <h1 style="margin:24px 0 12px;font-family:Lora,Georgia,serif;font-weight:500;font-size:clamp(30px,4vw,48px);line-height:1.1;letter-spacing:-.015em;text-wrap:balance">{{ t.title }}</h1>
    <p style="margin:0 auto 32px;max-width:520px;font-size:17px;line-height:1.6;text-wrap:pretty">{{ t.text }}</p>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 24px">
      <a href="./" style="display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:7px;background:#284B3C;color:#fff;text-decoration:none;font-weight:600;font-size:16px" style-hover="background:#1B3529;color:#fff">{{ t.home }}</a>
      <a href="tel:+37258152876" style="display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:16px;color:#284B3C;text-decoration:none;transition:color .25s ease" style-hover="color:#1B3529">{{ t.call }}&nbsp;+372 5815 2876</a>
    </div>
  </main>
  <div aria-hidden="true" style="height:clamp(110px,11vw,170px);background:#F6F3EC url(assets/liidia-pattern-green.png) repeat-x center/auto 100%"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const COPY = {
  ru: { title: 'Такой страницы нет', text: 'Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там всё о гостевом доме Liidia.', home: 'На главную', call: 'Позвонить' },
  et: { title: 'Sellist lehte ei ole', text: 'Link võib olla aegunud või aadressis on viga. Minge avalehele — seal on kõik Liidia Puhkemajast.', home: 'Avalehele', call: 'Helista' },
  en: { title: 'This page doesn’t exist', text: 'The link may be out of date or the address mistyped. Head back to the home page for everything about Liidia guest house.', home: 'Back to home', call: 'Call' }
};
const LANGS = [{ code: 'et', label: 'ET', name: 'Eesti', flag: 'https://flagcdn.com/ee.svg' }, { code: 'ru', label: 'RU', name: 'Русский', flag: 'https://flagcdn.com/ru.svg' }, { code: 'en', label: 'EN', name: 'English', flag: 'https://flagcdn.com/gb.svg' }];
class Component extends DCLogic {
  state = { lang: (() => { try { const v = localStorage.getItem('liidia-lang'); return COPY[v] ? v : 'et'; } catch (e) { return 'et'; } })() };
  componentDidMount() { this.onKey = (e) => { if (e.key === 'Escape') this.setState({ langOpen: false }); }; this.onDown = (e) => { if (this.state.langOpen && !e.target.closest('[aria-haspopup]') && !e.target.closest('[role="menu"]')) this.setState({ langOpen: false }); }; window.addEventListener('keydown', this.onKey); document.addEventListener('pointerdown', this.onDown); document.documentElement.lang = this.state.lang; [300, 1500].forEach((t) => setTimeout(() => this.startDrift(), t)); this.driftResize = () => { clearTimeout(this.driftT); this.driftT = setTimeout(() => this.startDrift(), 300); }; window.addEventListener('resize', this.driftResize); }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); document.removeEventListener('pointerdown', this.onDown); window.removeEventListener('resize', this.driftResize); (this.drifts || []).forEach((a) => a.cancel()); }
  startDrift() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.drifts = this.drifts || []; this.driftSeen = this.driftSeen || new WeakSet();
    document.querySelectorAll('[style*="liidia-pattern"]').forEach((el) => {
      if (!el.animate || this.driftSeen.has(el)) return;
      const vertical = (el.getAttribute('style') || '').indexOf('sand-v') >= 0;
      const r = el.getBoundingClientRect();
      const size = vertical ? r.width : r.height;
      if (!size) return;
      const tile = Math.round(size * 433 / 520);
      const prop = vertical ? 'backgroundPositionY' : 'backgroundPositionX';
      this.driftSeen.add(el);
      this.drifts.push(el.animate([{ [prop]: '0px' }, { [prop]: (vertical ? tile : -tile) + 'px' }], { duration: 45000, iterations: Infinity, easing: 'linear' }));
    });
  }

  componentDidUpdate() { document.documentElement.lang = this.state.lang; }
  renderVals() {
    const lang = this.state.lang, open = !!this.state.langOpen;
    const cur = LANGS.find((l) => l.code === lang) || LANGS[0];
    return {
      t: COPY[lang],
      toggleLang: () => this.setState({ langOpen: !open }), langCode: lang.toUpperCase(), langFlag: cur.flag, langBtnLabel: cur.name,
      langExpanded: open ? 'true' : 'false', langHidden: open ? 'false' : 'true', langVis: open ? 'visible' : 'hidden', langOpacity: open ? 1 : 0, langShift: open ? 'none' : 'translateY(-6px)', langChevron: open ? 'rotate(180deg)' : 'none',
      langs: LANGS.map((l) => ({ ...l, pressed: l.code === lang ? 'true' : 'false', bg: l.code === lang ? '#F6F3EC' : 'transparent', fg: l.code === lang ? '#284B3C' : '#62685E',
        pick: () => { try { localStorage.setItem('liidia-lang', l.code); } catch (e) {} this.setState({ lang: l.code, langOpen: false }); } }))
    };
  }
}
</script>
</body>
</html>
